  - name: install_freezes_env_by_default
    id: I009
    provenance:
      node_id: tests/cli/test_main_install.py::test_install_freezes_env_by_default
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/cli/test_main_install.py#L25-L50
    kind: solve
    description: |
      This test simulates the final solve of test_install_freezes_env_by_default.
      The original test creates an env with dependent=2.0 (which pulls
      dependency=2.0), then downgrades to dependent=1.0 (which pulls
      dependency=1.0). It then installs another_dependent with
      --freeze-installed and asserts that dependent and dependency
      remain at version 1.0.
    input:
      channels: channel-6
      specs_to_add: another_dependent
      prefix:
        - channel-6/noarch::dependent-1.0-0
        - channel-6/noarch::dependency-1.0-0
      history_specs: dependent=1.0
      update_modifier: freeze_installed
    output:
      final_state:
        - channel-6/noarch::dependency-1.0-0
        - channel-6/noarch::dependent-1.0-0
        - channel-6/noarch::another_dependent-2.0-0

